{% extends "base.html" %}
{% block title %}Register Account — CloudVault{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="card-title text-center mb-3">Create CloudVault Account</h3>
            <p class="text-muted text-center mb-4">Register your identity to store and collaborate on sensitive documents</p>

            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required minlength="3" placeholder="Choose a username">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password (Minimum 8 Characters)</label>
                    <input type="password" class="form-control" id="password" name="password" required minlength="8" placeholder="Enter secure password">
                </div>
                <button type="submit" class="btn btn-success w-100 py-2">Create Account</button>
            </form>

            <div class="text-center mt-3">
                <span class="text-muted">Already have an account?</span> 
                <a href="{{ url_for('auth.login') }}">Login here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
